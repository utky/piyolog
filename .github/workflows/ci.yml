name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (ruff format)
        run: uv run ruff format --check .

      - name: Lint (sqlfluff)
        run: uv run sqlfluff lint dbt/models dbt/tests sql/analysis

      - name: Run tests
        run: uv run pytest --tb=short

      # BigQuery Python UDF は python-3.11 でのみ動くため、UDF 本体のテストを 3.11 でも実行する
      # (ADR-0009)。テストは stdlib + pytest のみに依存するのでプロジェクト依存は入れない。
      - name: Run UDF tests on BigQuery runtime (Python 3.11)
        run: uv run --no-project --python 3.11 --with pytest pytest --tb=short tests/test_parse.py
