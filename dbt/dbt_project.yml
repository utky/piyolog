name: "piyolog"
version: "1.0.0"
config-version: 2

profile: "piyolog"

model-paths: ["models"]
function-paths: ["functions"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# profiles.yml の dataset (既定 "piyolog") と +schema を dbt 標準の
# generate_schema_name ("<dataset>_<schema>") で連結し、piyolog_staging /
# piyolog_intermediate / piyolog_marts データセットに振り分ける。
models:
  piyolog:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

# 既知種別の seed は intermediate の種別振り分けで使うため piyolog_intermediate に置く。
seeds:
  piyolog:
    +schema: intermediate

# parse_piyolog_export UDF は staging と同じ piyolog_staging データセットに置く。
functions:
  piyolog:
    +schema: staging
